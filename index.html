<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝贝学习乐园</title>
<meta name="description" content="给 4 岁左右宝贝设计的益智学习小游戏：认汉字、数一数、颜色形状、动物水果、英文字母、公主换装。免费无广告，可离线玩。">
<meta name="theme-color" content="#ffd166">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宝贝乐园">
<meta property="og:title" content="宝贝学习乐园">
<meta property="og:description" content="给最棒的宝贝，一起玩吧！">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; min-height:100%; }
  body {
    font-family: 'Comic Sans MS','Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
    background: linear-gradient(160deg, #89d4ff 0%, #a8e6ff 30%, #fff3b0 70%, #ffd6e0 100%);
    background-attachment: fixed;
    color:#4a3b6b;
    user-select:none;
    overscroll-behavior:none;
  }
  #app { min-height:100vh; display:flex; flex-direction:column; }
  .screen { flex:1; display:flex; flex-direction:column; align-items:center; padding: 18px 16px 30px; }
  .hidden { display:none !important; }

  /* ---------- 首页 ---------- */
  .top-tools { position:fixed; top:12px; right:14px; display:flex; gap:8px; z-index:50; }
  .tool-btn { width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#ffffffcc;font-size:20px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15);font-family:inherit; }
  h1.title {
    font-size: clamp(30px, 6vw, 52px);
    margin: 18px 0 6px;
    background: linear-gradient(90deg,#ff5e7e,#ff9f43,#f9d423,#38d9a9,#4dabf7,#9775fa);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-align:center;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.8));
  }
  .subtitle { text-align:center; font-size: clamp(14px,2.4vw,20px); color:#7a6aa0; margin-bottom:10px; }
  .star-total {
    background:#fff; border:3px solid #ffd166; color:#e8890c; font-weight:bold;
    padding:6px 22px; border-radius:999px; font-size: clamp(18px,3vw,26px);
    box-shadow:0 4px 0 rgba(232,137,12,.25); margin-bottom: 20px;
  }
  #module-grid {
    display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 200px));
    gap: 18px; justify-content:center; width:100%; max-width:860px;
  }

  /* ---------- 首页欢迎横幅 ---------- */
  #welcome { cursor:pointer; margin: -4px 0 14px; text-align:center; }
  #welcome .bubble {
    display:inline-block; background:#fff; color:#7a5aa0; font-weight:bold;
    font-size: clamp(14px, 2.4vw, 18px); padding: 7px 18px; border-radius: 999px;
    box-shadow: 0 3px 0 rgba(0,0,0,.08); position:relative; margin-bottom: 2px;
  }
  #welcome .mascots { display:flex; justify-content:center; align-items:flex-end; gap: 2px; }
  #welcome .m { display:inline-block; animation: hop 1.5s ease-in-out infinite; }
  #welcome .m svg { display:block; }

  /* ---------- 动画明星模块 ---------- */
  .cartoon-card {
    background: linear-gradient(180deg, #ffffff 55%, #fff0f5);
    border:5px solid #ffb3c8; border-radius:26px;
    padding: 8px 26px 4px; box-shadow:0 8px 0 rgba(0,0,0,.08), 0 14px 30px rgba(255,143,176,.25); display:inline-block;
  }
  .cartoon-card svg { width: clamp(110px, 20vw, 150px); height:auto; display:block; }
  .char-opt { display:flex; align-items:flex-end; justify-content:center; width:100%; height:100%; }
  .char-opt svg { width: clamp(84px, 15vw, 126px); height:auto; display:block; }

  /* ---------- AI 插画选项（图片加载失败时显示底下的 emoji/手绘兜底） ---------- */
  .img-opt { display:block; width:100%; height:100%; }
  .img-wrap { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  .img-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:18px; }
  .img-wrap .fb { display:flex; align-items:center; justify-content:center; font-size: clamp(40px,8vw,64px); }
  .img-wrap.big { width: clamp(140px,26vw,190px); height: clamp(140px,26vw,190px); }
  .img-wrap.big img { border-radius:20px; }
  .option.has-img { width:clamp(130px,24vw,190px); height:clamp(120px,22vw,180px); min-width:0; min-height:0; padding:6px; overflow:hidden; }

  /* ---------- 公主换装 ---------- */
  #doll-stage { position:relative; width:100%; height:clamp(300px, 46vh, 430px); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #doll-stage svg { width: clamp(200px, 30vw, 250px); height:auto; filter: drop-shadow(0 10px 16px rgba(255,143,176,.35)); }
  #doll-stage canvas { width:100% !important; height:100% !important; display:block; touch-action:none; cursor:grab; }
  .dz-btn { width:auto !important; height:auto !important; min-width:140px; min-height:64px; font-size:clamp(17px,3.2vw,24px) !important; padding:8px 18px; }
  .dz-name {
    margin-top:8px; display:flex; align-items:center; justify-content:center; gap:4px;
    background:#fff; border:3px solid #ffd166; border-radius:999px; padding:4px 16px;
    box-shadow:0 3px 0 rgba(0,0,0,.08); max-width:96%;
  }
  .dz-name .dz-name-ico { width:20px; height:20px; flex:none; }
  .dz-name .dz-name-ico svg { width:100%; height:100%; display:block; }
  .dz-name .dz-name-txt { font-size:clamp(12px,2.2vw,16px); color:#7a5aa0; font-weight:bold; }

  /* 拖拽换装布局：舞台 + 侧边物品面板 */
  .dz-play { display:flex; flex-direction:column; width:100%; align-items:center; gap:8px; }
  @media (min-width: 880px){
    .dz-play { flex-direction:row; justify-content:center; align-items:stretch; }
    #doll-stage { flex:1 1 55%; height:clamp(340px, 54vh, 480px) !important; }
    .dz-side { flex:0 0 310px; display:flex; flex-direction:column; gap:8px; }
  }
  .dz-panel { background:#fff; border:4px solid #ffd166; border-radius:20px; padding:8px 8px 4px; width:100%; max-width:600px; box-shadow:0 6px 0 rgba(0,0,0,.08); }
  .dz-tabs { display:flex; gap:8px; margin-bottom:8px; }
  .dz-tab { flex:1; font-size:clamp(24px,4.5vw,32px); padding:7px 0 5px; border-radius:14px; border:3px solid #e6d9ff; background:#faf6ff; cursor:pointer; font-family:inherit; color:#7a5aa0; }
  .dz-tab.on { border-color:#ffd166; background:#fff8e1; }
  .dz-shelf { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none; }
  .dz-shelf::-webkit-scrollbar { display:none; }
  .dz-item {
    flex:0 0 auto; width:76px; height:88px; border:3px solid #e6d9ff; border-radius:16px;
    background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; cursor:grab; touch-action:none; position:relative; user-select:none; -webkit-user-select:none;
  }
  .dz-item svg { width:46px; height:auto; pointer-events:none; }
  .dz-item .dz-item-txt { font-size:11px; color:#8b7ab0; max-width:66px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dz-item.on { border-color:#ffd166; background:#fff8e1; box-shadow:0 0 0 3px rgba(255,209,102,.35); }
  .dz-item.dragging { opacity:.35; }
  .dz-ghost { position:fixed; z-index:220; pointer-events:none; width:72px; height:84px; transform:translate(-50%,-50%); filter:drop-shadow(0 8px 14px rgba(0,0,0,.3)); }
  .dz-ghost svg { width:100%; height:auto; }
  .dz-ghost.fly { transition: transform .28s ease-in; }

  /* ---------- 公主换装 · 装扮任务（图形化：图标+目标缩略图） ---------- */
  .dz-task {
    background:#fff; border:3px solid #c5a3ff; border-radius:20px; color:#7c4dff;
    box-shadow:0 3px 0 rgba(124,77,255,.2); margin: 0 auto 8px; max-width:96%;
    display:flex; align-items:center; gap:10px; padding:7px 16px;
  }
  .dz-task .dz-task-emoji { font-size:clamp(26px,5vw,34px); flex:none; }
  .dz-task .dz-task-ico { width:54px; height:60px; flex:none; display:flex; align-items:center; justify-content:center; border:2px dashed #e6d9ff; border-radius:12px; background:#fdfaff; }
  .dz-task .dz-task-ico svg { width:100%; max-height:56px; height:auto; display:block; }
  .dz-task .dz-task-txt { font-size:clamp(15px,2.6vw,20px); font-weight:bold; line-height:1.3; }
  .dz-task.ok { border-color:#51cf66; background:#f0fff4; }
  .dz-task.ok .dz-task-txt { color:#2b8a3e; }
  .dz-task.ok .dz-task-ico { border-style:solid; border-color:#51cf66; background:#e6ffec; font-size:30px; }
  #options.dz-grid { display:grid; grid-template-columns:repeat(3, minmax(118px, 1fr)); gap:12px; width:100%; max-width:600px; }
  .dz-btn { width:100% !important; min-width:0 !important; }

  /* ---------- 公主换装间（成熟换装游戏集成：分类页签+物品网格+换色） ---------- */
  #dz2 { position:relative; width:100%; height:clamp(480px, 76vh, 700px); display:flex; flex-direction:column; background:linear-gradient(#bdeaff 85%,#9be37a 85%); border-radius:22px; overflow:hidden; box-shadow:0 8px 24px rgba(224,80,143,.18); }
  #dz2 * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  #dz2 #stage { flex:1; min-height:0; position:relative; }
  #dz2 #sv { width:100%; height:100%; display:block; }
  #dz2 .fab { width:52px; height:52px; border-radius:50%; border:0; background:#fff; font-size:28px; box-shadow:0 3px 8px #0003; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  #dz2 .fab:active { transform:scale(.9); }
  #dz2 #tools { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:10px; }
  #dz2 #panel { background:#fff; border-radius:24px 24px 0 0; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -4px 14px #e0508f33; max-height:44%; display:flex; flex-direction:column; }
  #dz2 #tabs { display:flex; gap:6px; }
  #dz2 .tab { flex:1; height:54px; border:0; border-radius:18px; background:#ffeef6; font-size:31px; cursor:pointer; padding:0; font-family:inherit; display:flex; align-items:center; justify-content:center; }
  #dz2 .tab.on { background:#ffd3e6; box-shadow:inset 0 0 0 3px #ff5fa2; }
  #dz2 .tab.on { background:#ff8fc0; transform:translateY(-4px) scale(1.06); box-shadow:0 4px 0 #e0508f; }
  #dz2 #items { display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:8px; padding:10px 2px 2px; overflow-y:auto; min-height:0; }
  #dz2 .it { aspect-ratio:1; max-height:86px; border:3px solid #ffd3e6; border-radius:18px; background:#fff8fc; padding:3px; cursor:pointer; font-size:32px; }
  #dz2 .it svg { width:100%; height:100%; display:block; }
  #dz2 .it.on { border-color:#ff5fa2; background:#ffe3f1; transform:scale(1.08); }
  #dz2 #sw { display:none; gap:10px; padding:12px 6px 4px; overflow-x:auto; flex-shrink:0; }
  #dz2 .sq { width:42px; height:42px; min-width:42px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #ffd3e6; cursor:pointer; padding:0; }
  #dz2 .sq.on { box-shadow:0 0 0 4px #ff5fa2; transform:scale(1.15); }
  #dz2 #girl { animation:dz2idle 2.6s ease-in-out infinite; }
  @keyframes dz2idle { 50% { transform:translateY(-4px); } }
  #dz2 #gi { transform-box:view-box; transform-origin:150px 440px; }
  #dz2 #gi.bn { animation:dz2bn .6s; }
  #dz2 #gi.tw { animation:dz2tw 1s; }
  @keyframes dz2bn { 0%{transform:scale(1)} 30%{transform:scale(1.12,.88)} 60%{transform:scale(.94,1.1)} 100%{transform:scale(1)} }
  @keyframes dz2tw { 0%{transform:scaleX(1)} 25%{transform:scaleX(-1)} 50%{transform:scaleX(1)} 75%{transform:scaleX(-1)} 100%{transform:scaleX(1)} }
  #dz2 .eye { transform-box:fill-box; transform-origin:center; animation:dz2bl 4s infinite; }
  @keyframes dz2bl { 0%,94%,100%{transform:scaleY(1)} 97%{transform:scaleY(.1)} }
  #dz2 #fx { position:absolute; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  #dz2 #fx span { position:absolute; line-height:1; }
  #dz2 #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; transition:opacity .45s; }
  #dz2 #flash.on { opacity:.95; transition:none; }
  @media (orientation:landscape) and (max-height:620px){
    #dz2 { flex-direction:row; height:min(94vh, 620px); }
    #dz2 #stage { flex:1; }
    #dz2 #panel { width:46%; max-height:none; border-radius:24px 0 0 24px; box-shadow:-4px 0 14px #e0508f33; }
    #dz2 #items { flex:1; }
  }
  @media (prefers-reduced-motion:reduce){ #dz2 #girl, #dz2 .eye { animation:none; } }
  .doll-happy { animation: doll-happy .9s ease both; }
  @keyframes doll-happy {
    0%,100%{ transform:translateY(0) rotate(0deg); }
    20%{ transform:translateY(-7px) rotate(-3deg); }
    45%{ transform:translateY(-3px) rotate(2deg); }
    70%{ transform:translateY(-6px) rotate(-2deg); }
  }

  /* ---------- 公主换装 · 我的衣柜 ---------- */
  .wardrobe-mask { position:fixed; inset:0; background:rgba(60,42,90,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .wardrobe-panel { background:#fff; border:5px solid #ffd166; border-radius:26px; padding:18px 20px; max-width:560px; width:100%; max-height:86vh; overflow:auto; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.25); }
  .wardrobe-panel h3 { margin:0 0 4px; color:#e8890c; font-size: clamp(20px,4vw,26px); }
  .wd-progress { font-size:15px; color:#7a6aa0; margin-bottom:12px; }
  .wd-group { text-align:left; margin-bottom:10px; }
  .wd-group .g-name { font-weight:bold; color:#5a4a80; font-size:16px; margin-bottom:6px; }
  .wd-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .wd-cell { border:2px dashed #e6d9ff; border-radius:14px; padding:6px 4px; color:#8b7ab0; background:#fdfaff; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .wd-cell svg { width:34px; height:auto; }
  .wd-cell .wd-lb { font-size:12px; line-height:1.2; }
  .wd-cell.on { border-style:solid; border-color:#ffd166; background:#fffbe8; color:#b45309; font-weight:bold; }

  /* ---------- 翻翻乐 ---------- */
  #options.mem-grid { display:grid; grid-template-columns: repeat(3, minmax(120px, 180px)); gap:16px; justify-content:center; }
  .mem-card { min-width:0; min-height:0; aspect-ratio:1/1; padding:0; border:none; background:none; box-shadow:none; perspective:600px; }
  .mem-inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .45s; }
  .mem-card.open .mem-inner, .mem-card.matched .mem-inner { transform: rotateY(180deg); }
  .mem-face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:20px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .mem-front { background:linear-gradient(145deg,#ff9ec6,#f06a9b); font-size:clamp(30px,6vw,46px); box-shadow:0 6px 0 rgba(0,0,0,.12); }
  .mem-back { background:#fff; border:4px solid #ffd166; transform:rotateY(180deg); overflow:hidden; padding:4px; }
  .mem-back .img-opt, .mem-back .img-wrap { width:100%; height:100%; }
  .mem-back img { border-radius:14px; }
  .mem-card.matched .mem-back { background:#f0fff4; border-color:#51cf66; }
  @keyframes hop { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-9px); } }
  .module-card {
    border:4px solid #fff; border-radius: 28px; padding: 20px 10px 16px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow: 0 8px 0 rgba(0,0,0,.12), 0 12px 24px rgba(0,0,0,.10);
    transition: transform .15s ease;
    font-family:inherit;
  }
  .module-card:hover { transform: translateY(-4px) scale(1.03); }
  .module-card:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .module-card .m-icon { font-size: clamp(44px, 8vw, 64px); line-height:1; }
  .module-card .m-name { font-size: clamp(18px, 3.2vw, 26px); font-weight:bold; color:#5a4a80; }
  .parent-hint { margin-top:26px; font-size:13px; color:#8b7ab0; text-align:center; line-height:1.6; max-width:720px; }

  /* ---------- 今日统计 ---------- */
  .today-line { text-align:center; font-size: clamp(13px,2.2vw,17px); color:#7a6aa0; margin: -10px 0 18px; }
  #stats-mask { position:fixed; inset:0; background:rgba(60,42,90,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .stats-panel { background:#fff; border:5px solid #ffd166; border-radius:26px; padding:22px 26px; max-width:440px; width:100%; text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.25); }
  .stats-panel h3 { margin:0 0 14px; color:#e8890c; font-size: clamp(20px,4vw,28px); }
  .stats-rows { text-align:left; font-size: clamp(15px,2.6vw,18px); color:#5a4a80; line-height:2; margin-bottom:16px; }
  .stats-rows .row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed #f0e6ff; }
  .stats-close { border:3px solid #ffd166; background:#fff8e6; color:#b45309; font-weight:bold; border-radius:999px; padding:10px 30px; font-size:17px; cursor:pointer; font-family:inherit; }

  /* ---------- 游戏页 ---------- */
  .game-header {
    width:100%; max-width: 900px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom: 8px;
  }
  #back-btn {
    border:3px solid #fff; background:#fff; color:#5a4a80; font-weight:bold;
    border-radius:999px; padding:8px 18px; font-size:18px; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.12); font-family:inherit;
  }
  #game-title { font-size: clamp(20px,3.6vw,30px); font-weight:bold; color:#5a4a80; }
  .game-star { font-size: clamp(18px,3vw,26px); font-weight:bold; color:#e8890c; background:#fff; border:3px solid #ffd166; border-radius:999px; padding:4px 16px; white-space:nowrap; }

  #question-area { width:100%; max-width:900px; display:flex; flex-direction:column; align-items:center; gap: 14px; }
  #prompt-visual { min-height: 150px; display:flex; align-items:center; justify-content:center; width:100%; }

  .count-grid { display:flex; flex-wrap:wrap; justify-content:center; gap: 6px 16px; max-width: 660px; }
  .count-item { font-size: clamp(34px, 7vw, 60px); animation: pop-in .4s both; }

  .hanzi-card { background:#fff; border:5px solid #ffd166; border-radius:26px; padding: 8px 34px 16px; text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.08); }
  .hanzi-card .pinyin { color:#ff8fab; font-weight:bold; font-size: clamp(18px,3vw,26px); }
  .hanzi-card .hanzi { font-size: clamp(64px, 14vw, 120px); font-weight:bold; color:#5a4a80; line-height:1.1; }

  .abc-card { background:#fff; border:5px solid #c5a3ff; border-radius:26px; padding: 10px 30px 16px; text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.08); }
  .abc-card .letter { font-size: clamp(56px, 12vw, 100px); font-weight:bold; color:#7c4dff; line-height:1.05; }
  .abc-card .abc-word { font-size: clamp(22px,4vw,34px); font-weight:bold; color:#5a4a80; }

  .add-row { display:flex; align-items:center; gap: 12px; flex-wrap:wrap; justify-content:center; }
  .add-group { display:flex; flex-wrap:wrap; gap:2px 10px; max-width: 210px; justify-content:center; }
  .add-group .a-item { font-size: clamp(28px,5vw,44px); }
  .add-op { font-size: clamp(30px,6vw,52px); font-weight:bold; color:#5a4a80; }
  .ask-hint { font-size: clamp(26px,5vw,40px); color:#5a4a80; font-weight:bold; }

  #options { display:flex; gap: 18px; flex-wrap:wrap; justify-content:center; width:100%; }
  .option {
    min-width: clamp(120px, 24vw, 190px);
    min-height: clamp(110px, 22vw, 180px);
    border-radius: 26px; border:5px solid #ffd166; background:#fff;
    font-size: clamp(40px, 9vw, 72px); font-weight:bold; color:#5a4a80;
    cursor:pointer; box-shadow: 0 8px 0 rgba(0,0,0,.12);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease; font-family:inherit; padding:10px;
    touch-action: manipulation;
  }
  .option:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); }
  .option:active:not(:disabled) { transform: translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.12); }

<script>
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,k){ return shuffle(arr.slice()).slice(0,k); }
const CN_NUM = ['零','一','二','三','四','五','六','七','八','九','十'];

function numberOptions(n, k, max, min){
  const lo = min || 1, hi = max || 10;
  const s = new Set([n]); let guard = 0;
  while(s.size < k && guard++ < 60){
    const d = (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random()*3));
    const v = n + d;
    if(v >= lo && v <= hi) s.add(v);
  }
  return shuffle([...s]);
}

/* ================= 语音 ================= */
let muted = false;
try { muted = localStorage.getItem('baby_muted') === '1'; } catch(e){}
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

function pickVoice(lang){
  if(!synth) return null;
  try{
    const vs = synth.getVoices();
    if(!vs.length) return null;
    const p = lang.slice(0,2).toLowerCase();
    const match = re => v => v.lang.toLowerCase().startsWith(p) && re.test(v.name);
    // 优先"在线自然语音"（Edge 提供，音色最甜最自然），其次离线语音
    const online = p === 'zh' ? /Xiaoyi Online|Xiaoxiao Online|Xiaochen Online|Xiaomo Online|Yunxi Online|Yunyang Online/i
                              : /Jenny Online|Aria Online|Emma Online/i;
    const offline = p === 'zh' ? /Xiaoxiao|Xiaoyi|Huihui|Yaoyao|Tingting|Yunyang|Kangkang/i
                               : /Aria|Jenny|Zira|Guy|Emma/i;
    return vs.find(match(online)) || vs.find(match(offline))
        || vs.find(v => v.lang.toLowerCase().startsWith(p)) || null;
  }catch(e){ return null; }
}

function toSeq(x){ return typeof x === 'string' ? [{t:x}] : x; }

function speakSeq(seq, done){
  seq = toSeq(seq);
  if(muted || !synth){ if(done) setTimeout(done, 500); return; }
  try{
    synth.cancel();
    let i = 0;
    const next = () => {
      if(i >= seq.length){ if(done) done(); return; }
      const item = seq[i++];
      const t = item.t, lang = item.lang || 'zh-CN';
      const v = pickVoice(lang);
      // 在线自然音色本身就很甜，不额外变调；离线音色稍微提高音调更像小妹妹
      const natural = v && /Online|\(Natural\)/i.test(v.name);
      const u = new SpeechSynthesisUtterance(t);
      u.lang = lang;
      u.rate = item.rate != null ? item.rate : (natural ? 0.95 : 0.9);
      u.pitch = item.pitch != null ? item.pitch : (natural ? 1.0 : 1.12);
      if(v) u.voice = v;
      let finished = false;
      const finish = () => { if(!finished){ finished = true; next(); } };
      u.onend = finish; u.onerror = finish;
      const guard = setTimeout(() => { try{ synth.cancel(); }catch(e){} finish(); },
                                Math.max(2600, t.length * 380));
      u.onend = () => { clearTimeout(guard); finish(); };
      u.onerror = () => { clearTimeout(guard); finish(); };
      synth.speak(u);
    };
    next();
  }catch(e){ if(done) setTimeout(done, 300); }
}

if(synth){ try{ synth.getVoices(); synth.onvoiceschanged = () => synth.getVoices(); }catch(e){} }

/* ================= 语音包按模块懒加载 =================
   make_voice.py 把全部真声音频按 key 前缀拆成多个分片文件
   （audio-core.js / audio-cartoon.js / ...），每个分片加载后
   合并进 window.AUDIO_DATA。首屏只加载 core，进哪个模块补哪个。 */
const AUDIO_PARTS = {
  core:     ['praise_', 'try_', 'bonus', 'welcome'],
  dressup:  ['dz_', 'dz2_'],
  cartoon:  ['toon_'],
  princess: ['pr_'],
  count:    ['count_'],
  hanzi:    ['hz_'],
  shape:    ['sc_'],
  animal:   ['an_'],
  add:      ['add_'],
  abc:      ['abc_'],
};
const loadedParts = {};
function partOfKey(key){
  for(const p in AUDIO_PARTS){
    if(AUDIO_PARTS[p].some(pre => key.indexOf(pre) === 0)) return p;
  }
  return null;
}
function loadAudioPart(p){
  if(loadedParts[p]) return loadedParts[p];
  const pr = new Promise(res => {
    const s = document.createElement('script');
    s.src = 'audio-' + p + '.js';
    s.onload = () => { rebuildTextIndex(); res(); };
    s.onerror = () => { delete loadedParts[p]; res(); };   // 加载失败静默降级为系统语音，可重试
    document.head.appendChild(s);
  });
  loadedParts[p] = pr;
  return pr;
}
function ensurePartsFor(texts){
  const parts = new Set(['core']);            // core 始终确保（表扬/鼓励/欢迎常用）
  (Array.isArray(texts) ? texts : [texts]).forEach(t => {
    if(!t) return;
    const k = textToKey[t];
    const p = k && partOfKey(k);
    if(p && !loadedParts[p]) parts.add(p);
  });
  return Promise.all([...parts].map(loadAudioPart));
}

/* ================= 真声音频播放（优先），系统语音兜底 ================= */
const textToKey = {};
function rebuildTextIndex(){
  const d = window.AUDIO_DATA;
  if(!d) return;
  for(const k in d){ const it = d[k]; if(it && it.t) textToKey[it.t] = k; }
}
let currentAudio = null;
function stopCurrentAudio(){
  if(currentAudio){
    try{ currentAudio.pause(); }catch(e){}
    currentAudio.onended = currentAudio.onerror = null;
    currentAudio = null;
  }
}
/* texts: 字符串数组。每个字符串若在已加载的语音分片里有预录音频则播放真声，否则用系统语音朗读 */
function playTexts(texts, done){
  if(muted){ if(done) setTimeout(done, 400); return; }
  const items = (Array.isArray(texts) ? texts : [texts]).filter(x => x);
  ensurePartsFor(items).then(() => {
    let i = 0;
    const next = () => {
      if(i >= items.length){ if(done) done(); return; }
      const text = items[i++];
      const key = textToKey[text];
      stopCurrentAudio();
      if(key && window.AUDIO_DATA[key] && window.AUDIO_DATA[key].s){
        const a = new Audio(window.AUDIO_DATA[key].s);
        currentAudio = a;
        const fin = () => { a.onended = a.onerror = null; setTimeout(next, 140); };
        a.onended = fin; a.onerror = fin;
        a.play().catch(() => speakSeq([{ t: text }], next));
      }else{
        speakSeq([{ t: text }], next);
      }
    };
    next();
  });
}

/* ---- 拖拽换装：从物品栏拖到娃娃身上就穿上（点一下也穿上） ---- */
let dzShelfPart = 'dress';
const DZ_PART_META = {
  dress: { len: () => DRESSES.length,   icon: miniDressSVG, label: i => DRESSES[i].label },
  hair:  { len: () => HAIRSTYLES.length, icon: miniHairSVG,  label: i => HAIRSTYLES[i] },
  acc:   { len: () => HAIR_ACCS.length,  icon: miniAccSVG,   label: i => HAIR_ACCS[i] },
};
function renderShelf(){
  const shelf = $('#dz-shelf');
  if(!shelf) return;
  const p = dzShelfPart, meta = DZ_PART_META[p];
  const cur = state.dressup[p];
  shelf.innerHTML = '';
  for(let i = 0; i < meta.len(); i++){
    const b = document.createElement('div');
    b.className = 'dz-item' + (i === cur ? ' on' : '');
    b.dataset.p = p; b.dataset.i = i;
    b.innerHTML = `${meta.icon(i)}<span class="dz-item-txt">${meta.label(i)}</span>`;
    shelf.appendChild(b);
  }
}
function bindShelfDrag(){
  const shelf = $('#dz-shelf');
  const stage = $('#doll-stage');
  if(!shelf || shelf.__dzDrag) return;
  shelf.__dzDrag = true;
  let src = null, part = null, idx = 0, ghost = null, dragging = false, sx = 0, sy = 0, justHandled = 0;
  const onDown = e => {
    const item = e.target.closest('.dz-item');
    if(!item) return;
    src = item; part = item.dataset.p; idx = +item.dataset.i;
    dragging = false; sx = e.clientX; sy = e.clientY;
  };
  shelf.addEventListener('pointerdown', onDown);
  // 点按兜底：pointer 事件不可用时（或极短点按）也直接穿上
  shelf.addEventListener('click', e => {
    const item = e.target.closest('.dz-item');
    if(!item) return;
    if(Date.now() - justHandled < 400) return;   // pointerup 刚处理过，避免双穿
    changeOutfitTo(item.dataset.p, +item.dataset.i);
  });
  window.addEventListener('pointermove', e => {
    if(!src) return;
    if(!dragging && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)){
      dragging = true;
      src.classList.add('dragging');
      ghost = document.createElement('div');
      ghost.className = 'dz-ghost';
      ghost.innerHTML = DZ_PART_META[part].icon(idx);
      document.body.appendChild(ghost);
    }
    if(ghost) ghost.style.left = e.clientX + 'px', ghost.style.top = e.clientY + 'px';
  });
  const finish = e => {
    if(!src) return;
    const wasDrag = dragging;
    const dropX = e.clientX, dropY = e.clientY;
    const item = src; const p = part; const i = idx;
    src = null; part = null; idx = 0; dragging = false;
    item.classList.remove('dragging');
    const stageRect = stage && stage.getBoundingClientRect();
    const onDoll = wasDrag && stageRect && dropX >= stageRect.left && dropX <= stageRect.right
      && dropY >= stageRect.top && dropY <= stageRect.bottom;
    if(ghost){
      if(onDoll){
        ghost.classList.add('fly');
        ghost.style.left = (stageRect.left + stageRect.width/2) + 'px';
        ghost.style.top = (stageRect.top + stageRect.height*0.45) + 'px';
        setTimeout(() => ghost && ghost.remove(), 300);
      }else{
        ghost.remove(); ghost = null;
      }
    }
    if(!wasDrag || onDoll) changeOutfitTo(p, i);   // 点按即穿；拖到娃娃身上也穿
    justHandled = Date.now();
  };
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', () => { if(ghost) ghost.remove(); ghost = null; if(src) src.classList.remove('dragging'); src = null; dragging = false; });
}
function changeOutfitTo(part, idx){
  const d = state.dressup;
  if(!d) return;
  d[part] = idx;
  const fresh = collectCheck(part, idx);
  renderDoll();
  renderShelf();
  const task = d.task;
  const act = { dress:'换裙子！', hair:'换个发型！', acc:'戴个新头饰！' }[part];
  if(task && task.type === part && idx === task.target){ finishDressTask(false); }
  else if(task && task.type === part){ playTexts([act, `再找找，她想要的是「${dzTargetLabel(task)}」哦～`]); }
  else if(fresh){ playTexts([act, '哇，又收集到一件新衣服啦！', pick(DZ_WOW_TEXTS)]); }
  else { playTexts([act, pick(DZ_WOW_TEXTS)]); }
}
function changeOutfit(part){   // 兼容旧调用：顺序换下一件
  const d = state.dressup;
  if(!d) return;
  const len = DZ_PART_META[part].len();
  changeOutfitTo(part, (d[part] + 1) % len);
}

function newDressTask(){
  const d = state.dressup;
  if(!d) return;
  if($('#game').classList.contains('hidden')) return;   // 已返回首页，不再播新任务
  const type = pick(['dress','hair','acc']);
  let target;
  if(type === 'dress') target = Math.floor(Math.random()*DRESSES.length);
  else if(type === 'hair') target = Math.floor(Math.random()*HAIRSTYLES.length);
  else target = Math.floor(Math.random()*6);          // “不戴”不作出题目标
  d.task = { type, target };
  const card = $('#dz-task');
  if(card){ card.classList.remove('ok'); card.innerHTML = dzTaskHTML(d.task); }
  const label = dzTargetLabel(d.task);
  if(d.task.type === 'dress') playTexts([`今天去参加${DZ_SCENES[d.task.target % DZ_SCENES.length]}，帮她穿上「${label}」吧！`]);
  else if(d.task.type === 'hair') playTexts([`公主想换个新发型，扎个「${label}」吧！`]);
  else playTexts([`还差一点点！帮她戴上「${label}」吧！`]);
}

function finishDressTask(fromMagic){
  const d = state.dressup;
  if(!d || !d.task) return;
  d.streak++;
  const combo = DZ_COMBO.find(c =>
    DRESSES[d.dress].label === c.dress && HAIRSTYLES[d.hair] === c.hair && HAIR_ACCS[d.acc] === c.acc) || null;
  let stars = 2;
  let praise = '🎉 装扮任务完成！+2⭐';
  const seq = [];
  if(fromMagic) seq.push('魔法变装！变变变！');
  seq.push('任务完成啦！公主真漂亮！');
  if(combo){ stars += 3; seq.push(combo.voice); praise = `🌟 ${combo.name}诞生啦！+5⭐`; }
  if(d.streak % 3 === 0){ stars += 3; seq.push('连做三个任务，你好厉害！多送你三颗小星星！'); praise += ' 🏆 连做3任务+3⭐'; }
  addStars(stars);
  confetti();
  if(dz3d.ok){ dz3d.jumpT = Math.max(dz3d.jumpT, 0.85); burst3D(); }
  showPraise(praise);
  const card = $('#dz-task');
  if(card){
    card.classList.add('ok');
    const ic = card.querySelector('.dz-task-ico');
    if(ic) ic.innerHTML = '✅';
    const tx = card.querySelector('.dz-task-txt');
    if(tx) tx.textContent = '真漂亮！';
    else card.innerHTML = '✅ 真漂亮！';
  }
  const stageWrap = $('#prompt-visual');
  if(stageWrap){ stageWrap.classList.add('doll-happy'); }
  playTexts(seq);
  clearTimeout(state.nextTimer);
  state.nextTimer = setTimeout(() => {
    if(stageWrap) stageWrap.classList.remove('doll-happy');
    newDressTask();
  }, 2400);
}

function changeOutfit(part){
  const d = state.dressup;
  if(!d) return;
  if(part === 'dress') d.dress = (d.dress + 1) % DRESSES.length;
  if(part === 'hair') d.hair = (d.hair + 1) % HAIRSTYLES.length;

      return {
        dress: w.dress.filter(i => i >= 0 && i < DRESSES.length),
        hair:  w.hair.filter(i => i >= 0 && i < HAIRSTYLES.length),
        acc:   w.acc.filter(i => i >= 0 && i < HAIR_ACCS.length),
      };
    }
  }catch(e){}

function dzWaveMesh(m, t){

    const a = Math.random()*Math.PI*2, sp = 9 + Math.random()*26, up = 15 + Math.random()*28;
    vel[i*3] = Math.cos(a)*sp; vel[i*3+1] = up; vel[i*3+2] = Math.sin(a)*sp;
    pos[i*3] = (Math.random()-0.5)*7; pos[i*3+1] = 80; pos[i*3+2] = (Math.random()-0.5)*7;
    life[i] = 1;
  }
}
function dzLoop(ts){
  dz3d.raf = 0;
  if(!dz3d.running || !dz3d.canvas || !dz3d.canvas.isConnected) return;
  if(!$('#game') || $('#game').classList.contains('hidden')){ dz3d.running = false; return; }
  const t = ts * 0.001;
  const dt = Math.min(0.05, t - (dz3d.t0 || t));
  dz3d.t0 = t;
  const doll = dz3d.doll;
  for(const dg of dz3d.dressGroup.children){
    if(!dg.visible) continue;
    for(const m of (dg.userData.waveLayers || [])) dzWaveMesh(m, t);
  }
  const breath = 1 + Math.sin(t*2)*0.015;
  doll.scale.set(breath, breath, breath);
  if(dz3d.jumpT > 0){
    dz3d.jumpT -= dt*1.1;
    const j = Math.max(0, dz3d.jumpT);
    doll.position.y = Math.abs(Math.sin(j*Math.PI*3)) * 13 * j;
    dz3d.shadow.scale.set(Math.max(0.3, 1 - j*0.28), Math.max(0.3, 1 - j*0.28), 1);
    dz3d.shadow.material.opacity = Math.max(0.04, 0.16 - j*0.07);
  }
  dz3d.rotV *= 0.96;
  doll.rotation.y += dz3d.rotV * dt * 8;
  dz3d.cam.position.z += (dz3d.camZ - dz3d.cam.position.z) * 0.08;
  dz3d.cam.position.y = 52 + Math.sin(t*0.6)*1.2;
  dz3d.cam.lookAt(0, 34, 0);
  dz3d.stars.rotation.y = t*0.05;
  dzUpdateParticles(dt);
  const w = dz3d.canvas.clientWidth, h = dz3d.canvas.clientHeight;
  if(w > 0 && h > 0 && (w !== dz3d.lastW || h !== dz3d.lastH)){
    dz3d.lastW = w; dz3d.lastH = h;
    dz3d.renderer.setSize(w, h, false);
    dz3d.cam.aspect = w / h; dz3d.cam.updateProjectionMatrix();
  }
  dz3d.renderer.render(dz3d.scene, dz3d.cam);
  dz3d.raf = requestAnimationFrame(dzLoop);
}
function dzBindEvents(){
  const cv = dz3d.canvas;
  if(!cv || cv.__dz) return;
  cv.__dz = true;
  const raycaster = new T3.Raycaster();
  const ndc = new T3.Vector2();
  cv.addEventListener('pointerdown', e => {
    dz3d.drag = { x: e.clientX, y: e.clientY, t: Date.now(), moved:false };
    if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if(!dz3d.drag) return;
    const dx = e.clientX - dz3d.drag.x;
    if(Math.abs(dx) > 6) dz3d.drag.moved = true;
    dz3d.doll.rotation.y += dx * 0.01;
    dz3d.rotV = dx * 0.012;
    dz3d.drag.x = e.clientX; dz3d.drag.y = e.clientY;
  });
  const up = e => {
    if(!dz3d.drag) return;
    const moved = dz3d.drag.moved, dt = Date.now() - dz3d.drag.t;
    dz3d.drag = null;
    if(moved || dt > 400) return;
    const rect = cv.getBoundingClientRect();
    ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, dz3d.cam);
    if(raycaster.intersectObject(dz3d.doll, true).length){
      dz3d.jumpT = Math.max(dz3d.jumpT, 0.65);
      playTexts([pick(DZ_WOW_TEXTS)]);
    }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', () => { dz3d.drag = null; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    dz3d.camZ = Math.max(84, Math.min(150, dz3d.camZ + e.deltaY * 0.06));
  }, { passive:false });
}
function dzStart3D(){
  if(!initDoll3D()) return false;
  const stageEl = $('#doll-stage');
  if(!stageEl) return false;
  const cv = dz3d.renderer.domElement;
  if(!cv.isConnected){
    stageEl.appendChild(cv);
    dz3d.canvas = cv;
    dz3d.lastW = 0; dz3d.lastH = 0;
    dzBindEvents();
  }
  dz3d.running = true;
  if(!dz3d.raf) dz3d.raf = requestAnimationFrame(dzLoop);
  return true;
}

function genCount(){
  const [e, name] = pick(COUNT_EMOJIS);
  const lv = state.level.count === 2 ? 2 : 1;
  const n = lv === 2 ? 6 + Math.floor(Math.random()*5) : 1 + Math.floor(Math.random()*5);
  const opts = lv === 2 ? numberOptions(n, 3, 10, 1) : numberOptions(n, 3, 5, 1);
  const items = Array.from({length:n}, (_,i) =>
    `<span class="count-item" style="animation-delay:${(i*0.12).toFixed(2)}s">${e}</span>`).join('');
  return {
    promptHTML: `<div class="count-grid">${items}</div>`,
    promptSpeak: [`数一数，这里有几个${name}呀？`],
    options: opts.map(v => ({html:String(v), value:String(v)})),
    answerValue: String(n),
    correctSpeak: [`${Array.from({length:n},(_,i)=>i+1).join('、')}，一共${CN_NUM[n]}个！`],
    nextDelay: 3400,
  };
}

function genHanzi(){
  // 错题本复习：答错过的字优先再考（60% 概率从错题本里出题）
  let t = pick(HANZI);
  if(state.wrongHanzi.length && Math.random() < 0.6){
    const w = HANZI.filter(h => state.wrongHanzi.includes(h.ch));
    if(w.length) t = pick(w);
  }
  const others = shuffle(HANZI.filter(h => h.ch !== t.ch)).slice(0, 2);
  const three = shuffle([t, ...others]);
  return {
    promptHTML: `<div class="hanzi-card"><div class="pinyin">${t.py}</div><div class="hanzi">${t.ch}</div></div>`,
    promptSpeak: [`${t.ch}。${t.phrase}的${t.ch}。你看，哪个是${t.phrase}呀？`],
    options: three.map(h => ({
      html: h.emoji, value: h.ch,
      wrongSpeak: [`这是“${h.ch}”，${h.phrase}的“${h.ch}”哦～`],
    })),
    answerValue: t.ch,
    correctSpeak: [`对啦，${t.ch}，${t.phrase}的${t.ch}！`],

}

/* 每个模块对应的语音分片（角色乐园混合出题，两个包都预加载）。
   按模块预加载而不是等出题文本反查，保证进模块第一句就是真人配音。 */
const MODULE_PARTS = {
  find: ['cartoon', 'princess'],
  dressup: ['dressup'],
  count: ['count'],
  hanzi: ['hanzi'],
  shape: ['shape'],
  animal: ['animal'],
  add: ['add'],
  abc: ['abc'],
};

/* ================= 游戏流程 ================= */
const state = {
  moduleId: null,
  sessionCorrect: 0,
  stars: 0,
  q: null,
  locked: false,
  streak: 0,
  level: { count: 1, add: 1 },
  wrongHanzi: [],
  today: { date: '', q: 0, ok: 0, stars: 0, mods: {} },
};
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
try {
  state.stars = parseInt(localStorage.getItem('baby_stars') || '0', 10) || 0;
  const lv = JSON.parse(localStorage.getItem('baby_levels') || '{}');
  if(lv && typeof lv === 'object'){
    state.level.count = lv.count === 2 ? 2 : 1;
    state.level.add  = lv.add  === 2 ? 2 : 1;
  }
  const wh = JSON.parse(localStorage.getItem('baby_wronghanzi') || '[]');
  if(Array.isArray(wh)) state.wrongHanzi = wh.filter(x => typeof x === 'string').slice(0, 15);
  const td = JSON.parse(localStorage.getItem('baby_today') || 'null');
  if(td && td.date === todayKey()) state.today = Object.assign({date:'', q:0, ok:0, stars:0, mods:{}}, td);
} catch(e){}

function saveLevels(){
  try { localStorage.setItem('baby_levels', JSON.stringify(state.level)); } catch(e){}
}
function saveWrongHanzi(){
  try { localStorage.setItem('baby_wronghanzi', JSON.stringify(state.wrongHanzi)); } catch(e){}
}
function saveToday(){
  try { localStorage.setItem('baby_today', JSON.stringify(state.today)); } catch(e){}
}

function addStars(n){
  state.stars += n;
  try { localStorage.setItem('baby_stars', String(state.stars)); } catch(e){}
  updateStars();
  if(state.moduleId){
    const t = state.today;
    if(t.date !== todayKey()){ t.date = todayKey(); t.q = 0; t.ok = 0; t.stars = 0; t.mods = {}; }
    t.stars += n;
    t.mods[state.moduleId] = (t.mods[state.moduleId] || 0) + n;
    saveToday();
  }
  updateToday();
}
function updateStars(){
  ['#total-stars', '#game-stars'].forEach(sel => {
    const el = $(sel);
    if(!el) return;
    el.textContent = state.stars;
    el.classList.remove('pop-anim'); void el.offsetWidth; el.classList.add('pop-anim');
  });
}

function confetti(){
  const layer = $('#confetti-layer');
  const pieces = ['🎉','⭐','🌟','✨','💖','🎈','🐷','🐶','🌸','🦄','🎀'];
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'confetti';
    p.textContent = pick(pieces);
    p.style.left = Math.random()*100 + 'vw';
    p.style.fontSize = (18 + Math.random()*22) + 'px';
    p.style.animationDuration = (0.9 + Math.random()*0.7) + 's';
    p.style.animationDelay = (Math.random()*0.25) + 's';
    layer.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

function showPraise(text){
  const el = $('#praise-text');
  el.textContent = text;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(showPraise._t);
  showPraise._t = setTimeout(() => { el.textContent = ''; }, 1900);
}

function showQuestion(){
  if($('#game').classList.contains('hidden')) return;   // 已经回家了
  const m = MODULES.find(x => x.id === state.moduleId);
  const q = m.gen();
  state.q = q; state.locked = false;

  $('#prompt-visual').innerHTML = q.promptHTML;
  const box = $('#options');
  box.classList.remove('mem-grid');
  box.innerHTML = '';
  q.options.forEach(op => {
    const b = document.createElement('button');
    b.className = 'option';
    if(q.useImg) b.classList.add('has-img');
    b.innerHTML = op.html;
    b.onclick = () => choose(b, op);
    box.appendChild(b);
  });
  playTexts(q.promptSpeak);
}

function choose(btn, op){
  if(state.locked) return;
  const q = state.q;
  if(String(op.value) === String(q.answerValue)){
    state.locked = true;
    btn.classList.add('correct');
    state.sessionCorrect++;
    state.streak++;
    const bonus = state.sessionCorrect % 5 === 0;
    addStars(bonus ? 3 : 1);
    confetti();
    // 今日统计
    const t = state.today;
    if(t.date !== todayKey()){ t.date = todayKey(); t.q = 0; t.ok = 0; t.stars = 0; t.mods = {}; }
    t.q++; t.ok++;
    saveToday();
    updateToday();
    // 认汉字：答对了就从错题本移除
    if(state.moduleId === 'hanzi' && q.answerValue){
      const i = state.wrongHanzi.indexOf(String(q.answerValue));
      if(i >= 0){ state.wrongHanzi.splice(i, 1); saveWrongHanzi(); }
    }
    // 自适应难度：数一数 / 加法连对 3 题升一级
    let levelUpText = null;
    if(state.moduleId === 'count' || state.moduleId === 'add'){
      const lvKey = state.moduleId === 'count' ? 'count' : 'add';
      if(state.level[lvKey] === 1 && state.streak >= 3){
        state.level[lvKey] = 2;
        saveLevels();
        levelUpText = '✨ 难度升级，更难的题目来咯！';
      }
    }
    const praise = pick(PRAISE);
    showPraise(levelUpText || (bonus ? '🎉 连对5题！奖励+2⭐' : praise));
    if(q.correctHTML) $('#prompt-visual').innerHTML = q.correctHTML;
    const seq = [bonus ? '连对五题，太厉害啦！多送你两颗小星星！' : praise];
    if(q.correctSpeak) seq.push(...(Array.isArray(q.correctSpeak) ? q.correctSpeak : [q.correctSpeak]));
    playTexts(seq);
    clearTimeout(state.nextTimer);
    state.nextTimer = setTimeout(showQuestion, q.nextDelay || 2500);
  }else{
    btn.classList.add('wrong');
    btn.disabled = true;
    state.streak = 0;
    const t = state.today;
    if(t.date !== todayKey()){ t.date = todayKey(); t.q = 0; t.ok = 0; t.stars = 0; t.mods = {}; }
    t.q++;
    saveToday();
    updateToday();
    // 认汉字：答错了把正确字记进错题本
    if(state.moduleId === 'hanzi' && q.answerValue){
      const c = String(q.answerValue);
      if(!state.wrongHanzi.includes(c)){
        state.wrongHanzi.push(c);
        if(state.wrongHanzi.length > 15) state.wrongHanzi.shift();
        saveWrongHanzi();
      }
    }
    const wrongArr = op.wrongSpeak ? (Array.isArray(op.wrongSpeak) ? op.wrongSpeak : [op.wrongSpeak]) : [];
    playTexts(wrongArr.concat([pick(TRY_AGAIN)]));
  }
}

/* ================= 页面导航 ================= */
function buildHome(){
  const grid = $('#module-grid');
  grid.innerHTML = '';
  MODULES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'module-card';
    b.style.background = m.bg;
    b.innerHTML = `<span class="m-icon">${m.icon}</span><span class="m-name">${m.name}</span>`;
    b.onclick = () => startModule(m.id);
    grid.appendChild(b);
  });
  // 首页欢迎横幅：佩奇一家 + 汪汪队
  $('#welcome .mascots').innerHTML = `
    <span class="m" style="animation-delay:0s">${pigSVG(['#ff6b81','#d92643'], 60)}</span>
    <span class="m" style="animation-delay:.15s">${pigSVG(['#5cb3ff','#2b7fd4'], 50, {dino:true})}</span>
    <span class="m" style="animation-delay:.3s">${pupSVG({fur:['#c99a6a','#a3754a'], ear:'#7c5333', uni:['#4d94ff','#1f5fc4'], muzz:'#e8c8a0', bg:['#dbeeff','#b9dcff']}, 50)}</span>
    <span class="m" style="animation-delay:.45s">${pupSVG({fur:['#ffffff','#ececec'], ear:'#f4f4f4', uni:['#ff6b6b','#d33030'], muzz:'#fdf4f4', spots:true, bg:['#ffe9e0','#ffd0c2']}, 50)}</span>
    <span class="m" style="animation-delay:.6s">${pupSVG({fur:['#f0c290','#d9a066'], ear:'#b9834f', uni:['#ff9ec6','#f06a9b'], muzz:'#fbe0c3', bg:['#ffe4f2','#ffc2e0']}, 50)}</span>`;
}

$('#welcome').onclick = () => {
  playTexts(['小猪佩奇和汪汪队欢迎你！我们一起玩吧！']);
};

function startModule(id){
  state.moduleId = id;
  state.sessionCorrect = 0;
  state.streak = 0;
  state.locked = true;                       // 防止旧题目的定时器/点击串场
  state.mem = null;
  clearTimeout(state.nextTimer);
  const m = MODULES.find(x => x.id === id);
  $('#game-title').textContent = `${m.icon} ${m.name}`;
  $('#home').classList.add('hidden');
  $('#game').classList.remove('hidden');
  updateStars();
  // 预加载本模块语音分片（角色乐园=卡通+公主两个包），加载完再出题，保证第一句就是真声
  Promise.all((MODULE_PARTS[id] || []).map(loadAudioPart)).then(() => {
    if(state.moduleId !== id) return;        // 等待期间用户已离开
    if(m.special === 'dressup'){ startDressup(); return; }
    showQuestion();
  });
}

$('#back-btn').onclick = () => {
  state.locked = true;
  state.mem = null;
  clearTimeout(state.nextTimer);
  stopCurrentAudio();
  if(synth){ try{ synth.cancel(); }catch(e){} }
  $('#game').classList.add('hidden');
  $('#home').classList.remove('hidden');
};

$('#repeat-btn').onclick = () => {
  if(state.q && !state.locked) playTexts(state.q.promptSpeak);
  else if(state.moduleId === 'dressup') playTexts(dz2LastSay.length ? dz2LastSay : ['欢迎来到公主换装间，快来选漂亮的衣服吧！']);
};

const muteBtn = $('#mute-btn');
function renderMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.onclick = () => {
  muted = !muted;
  try { localStorage.setItem('baby_muted', muted ? '1' : '0'); } catch(e){}
  if(muted){ stopCurrentAudio(); if(synth){ try{ synth.cancel(); }catch(e){} } }
  renderMute();
};
renderMute();

$('#fs-btn').onclick = () => {
  const d = document, el = d.documentElement;
  const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  const xfs = d.exitFullscreen || d.webkitExitFullscreen || d.msExitFullscreen;
  try{
    if(d.fullscreenElement || d.webkitFullscreenElement || d.msFullscreenElement){ if(xfs) xfs.call(d); }
    else if(rfs){ rfs.call(el); }
  }catch(e){}
};
// iPhone 上 Safari 不支持全屏 API，按钮隐藏
(function(){
  const el = document.documentElement;
  if(!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)){
    const b = $('#fs-btn'); if(b) b.style.display = 'none';
  }
})();

/* ================= 今日统计 ================= */
const MODNAME = {};
MODULES.forEach(m => MODNAME[m.id] = m.name);

function updateToday(){
  const t = state.today;
  if(t.date !== todayKey()){ t.date = todayKey(); t.q = 0; t.ok = 0; t.stars = 0; t.mods = {}; }
  const okEl = $('#today-ok'), stEl = $('#today-stars');
  if(okEl) okEl.textContent = t.ok;
  if(stEl) stEl.textContent = t.stars;
}
function renderStats(){
  const t = state.today;
  if(t.date !== todayKey()){ t.date = todayKey(); t.q = 0; t.ok = 0; t.stars = 0; t.mods = {}; }
  const body = $('#stats-body');
  const rows = [
    `<div class="row"><span>📅 今日日期</span><span>${t.date}</span></div>`,
    `<div class="row"><span>✏️ 今日答题</span><span>${t.q} 题</span></div>`,
    `<div class="row"><span>✅ 今日答对</span><span>${t.ok} 题</span></div>`,
    `<div class="row"><span>⭐ 今日得星</span><span>${t.stars} 颗</span></div>`,
  ];
  const mods = Object.keys(t.mods).filter(k => t.mods[k] > 0);
  if(mods.length){
    rows.push(`<div class="row"><span>🎮 各模块今日</span><span>${mods.map(k => (MODNAME[k] || k) + ' +' + t.mods[k]).join('、')}</span></div>`);
  }
  rows.push(`<div class="row"><span>🏆 累计星星</span><span>${state.stars} 颗</span></div>`);
  rows.push(`<div class="row"><span>💾 星星按设备保存</span><span>换设备不互通</span></div>`);
  body.innerHTML = rows.join('');
}
$('#stats-btn').onclick = () => { renderStats(); $('#stats-mask').classList.remove('hidden'); };
$('#stats-close').onclick = () => $('#stats-mask').classList.add('hidden');
$('#stats-mask').onclick = e => { if(e.target === $('#stats-mask')) $('#stats-mask').classList.add('hidden'); };
$('#wardrobe-close').onclick = () => $('#wardrobe-mask').classList.add('hidden');
$('#wardrobe-mask').onclick = e => { if(e.target === $('#wardrobe-mask')) $('#wardrobe-mask').classList.add('hidden'); };

/* ================= 启动 ================= */
buildHome();
updateStars();
updateToday();
loadAudioPart('core');                       // 先加载常用语音（表扬/鼓励/欢迎），其余按模块懒加载
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
